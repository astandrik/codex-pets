  <rect x="232.58550000000002" y="748.0099999999999" width="230.90499999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="348.038" y="774.9099999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="348.038" dy="-3.9000000000000012">Previous snapshot data</tspan><tspan x="348.038" dy="16.900000000000002">remains stored and recoverable</tspan></text>
</g>
