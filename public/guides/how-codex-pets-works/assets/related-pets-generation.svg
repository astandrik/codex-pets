  <text x="235.81375" y="168.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="235.81375" dy="-3.9000000000000012">Pairwise ranking</tspan><tspan x="235.81375" dy="16.900000000000002">for every approved pet</tspan></text>
</g>
