<polyline class="edge" data-from="V" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="yes" points="205.06208333333333,499.15833333333336 205.06208333333333,565.91 123.5895,565.91 123.5895,646.2099999999999" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="123.5895,700.0099999999999 123.58950000000002,748.0099999999999" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="V" data-to="H" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="building or failed" points="266.5654166666667,499.1583333333334 266.5654166666667,565.91 348.038,565.91 348.038,646.2099999999999" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
