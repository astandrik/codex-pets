  <rect x="154.44725" y="243.60000000000002" width="162.733" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="235.81375" y="270.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="235.81375" dy="-3.9000000000000012">Write a complete</tspan><tspan x="235.81375" dy="16.900000000000002">snapshot generation</tspan></text>
</g>
