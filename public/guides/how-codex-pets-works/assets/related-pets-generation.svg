  <text x="235.81375000000003" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="235.81375000000003" dy="-3.9000000000000012">Current metadata,</tspan><tspan x="235.81375000000003" dy="16.900000000000002">text vectors, and visual vectors</tspan></text>
