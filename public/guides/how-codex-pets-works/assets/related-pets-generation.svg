<g class="edge-label" data-from="V" data-to="A" data-label="yes">
  <rect x="105.5895" y="572.91" width="35.47" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="123.3245" y="588.06" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">yes</text>
</g>
