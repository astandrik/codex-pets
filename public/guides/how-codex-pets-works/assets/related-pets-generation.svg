  <text x="339.146" y="673.1099999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="339.146" dy="-3.9000000000000012">Keep the previous</tspan><tspan x="339.146" dy="16.900000000000002">compatible generation active</tspan></text>
</g>
</svg>