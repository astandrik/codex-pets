  <rect x="42.5935" y="748.0099999999999" width="161.99200000000002" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="123.58950000000002" y="774.9099999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="123.58950000000002" dy="-3.9000000000000012">Pet detail reads up to</tspan><tspan x="123.58950000000002" dy="16.900000000000002">four related pets</tspan></text>
</g>
<g class="node" data-id="H" data-label="Heuristic fallback
for pet detail" data-shape="rectangle">
  <rect x="276.3045" y="646.2099999999999" width="143.467" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="348.038" y="673.1099999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="348.038" dy="-3.9000000000000012">Heuristic fallback</tspan><tspan x="348.038" dy="16.900000000000002">for pet detail</tspan></text>
</g>
<g class="node" data-id="K" data-label="Previous snapshot data
