  <text x="231.36775000000003" y="270.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="231.36775000000003" dy="-3.9000000000000012">Write a complete</tspan><tspan x="231.36775000000003" dy="16.900000000000002">snapshot generation</tspan></text>
