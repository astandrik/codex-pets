  <text x="123.5895" y="673.1099999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="123.5895" dy="-3.9000000000000012">Atomically activate</tspan><tspan x="123.5895" dy="16.900000000000002">the generation in YDB</tspan></text>
</g>
<g class="node" data-id="D" data-label="Pet detail reads up to
